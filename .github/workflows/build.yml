name: build

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore pc-monitor.sln

      - name: Build
        run: dotnet build pc-monitor.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/PcMonitor.Core.Tests -c Release --no-build --logger "trx;LogFileName=tests.trx" --results-directory artifacts/test-results

      - name: Test UI text fit (WPF)
        run: dotnet test tests/PcMonitor.Ui.Tests -c Release --no-build --logger "trx;LogFileName=ui-tests.trx" --results-directory artifacts/test-results

      - name: Publish single-file exe
        run: dotnet publish src/PcMonitor.App/PcMonitor.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/publish

      - name: Check exe
        shell: pwsh
        run: |
          Get-ChildItem artifacts/publish | Format-Table Name, Length
          $exe = "artifacts/publish/pc-monitor.exe"
          if (-not (Test-Path $exe)) { throw "pc-monitor.exe missing" }
          $extra = Get-ChildItem artifacts/publish -File | Where-Object { $_.Extension -in ".dll", ".json" }
          if ($extra) { throw "publish is not single-file: $($extra.Name -join ', ')" }
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          $fileVersion = (Get-Item $exe).VersionInfo.FileVersion
          Write-Host "exe FileVersion $fileVersion, Directory.Build.props $version"
          if (-not $fileVersion.StartsWith($version)) { throw "exe version $fileVersion does not match $version" }

      - name: Screenshots (FakeSensorProvider)
        shell: pwsh
        run: |
          $exe = (Resolve-Path "artifacts/publish/pc-monitor.exe").Path
          New-Item -ItemType Directory -Force artifacts/shots | Out-Null
          $shots = (Resolve-Path "artifacts/shots").Path
          $runs = @(
            @{ name = "fake-fit-specs-1024x768"; args = @("--fake", "--show-specs", "--layout", "fit", "--size", "1024x768", "--ticks", "70") },
            @{ name = "fake-fit-compact-1024x768"; args = @("--fake", "--layout", "fit", "--compact", "--size", "1024x768", "--ticks", "70") },
            @{ name = "fake-nopawnio-specs-2col-1024x768"; args = @("--fake-no-pawnio", "--show-specs", "--layout", "2", "--size", "1024x768", "--ticks", "70") },
            @{ name = "fake-layout-dropdown-1024x768"; args = @("--fake", "--layout", "3", "--open-layout-box", "--size", "1024x768", "--ticks", "20") }
          )
          foreach ($r in $runs) {
            $png = Join-Path $shots "$($r.name).png"
            $log = Join-Path $shots "$($r.name).log"
            $all = $r.args + @("--screenshot", $png, "--log", $log, "--settings", (Join-Path $shots "settings-$($r.name).json"))
            $p = Start-Process -FilePath $exe -ArgumentList $all -PassThru
            if (-not $p.WaitForExit(180000)) { $p.Kill(); throw "$($r.name): timed out" }
            if (Test-Path $log) { Get-Content $log }
            if (-not (Test-Path $png)) { throw "$($r.name): no screenshot (exit $($p.ExitCode))" }
            Write-Host "$($r.name): $((Get-Item $png).Length) bytes"
          }

      - name: Soak test (fake sensors, 3 minutes, 100 ms updates, layouts/units cycling)
        shell: pwsh
        run: |
          Add-Type -Namespace Native -Name User32 -MemberDefinition '[DllImport("user32.dll")] public static extern uint GetGuiResources(System.IntPtr process, uint flags);'
          $exe = (Resolve-Path "artifacts/publish/pc-monitor.exe").Path
          New-Item -ItemType Directory -Force artifacts/soak | Out-Null
          $dir = (Resolve-Path "artifacts/soak").Path
          $log = Join-Path $dir "soak.log"
          $p = Start-Process -FilePath $exe -PassThru -ArgumentList @("--fake", "--show-specs", "--interval-ms", "100", "--cycle-every", "25",
            "--size", "1280x900", "--log", $log, "--settings", (Join-Path $dir "settings.json"))
          Start-Sleep -Seconds 30   # warm-up
          $samples = @()
          foreach ($i in 0..15) {
            if ($p.HasExited) { if (Test-Path $log) { Get-Content $log }; throw "app exited during soak (exit $($p.ExitCode))" }
            $p.Refresh()
            $samples += [pscustomobject]@{
              t = 30 + 10 * $i
              workingSetMB = [math]::Round($p.WorkingSet64 / 1MB, 1)
              privateMB = [math]::Round($p.PrivateMemorySize64 / 1MB, 1)
              handles = $p.HandleCount
              gdi = [Native.User32]::GetGuiResources($p.Handle, 0)
              user = [Native.User32]::GetGuiResources($p.Handle, 1)
            }
            if ($i -lt 15) { Start-Sleep -Seconds 10 }
          }
          $samples | Format-Table | Out-String | Write-Host
          $samples | Export-Csv (Join-Path $dir "soak.csv") -NoTypeInformation

          # Graceful close exercises the shutdown path (provider wait, settings save).
          $null = $p.CloseMainWindow()
          if (-not $p.WaitForExit(30000)) { $p.Kill(); throw "app did not exit within 30 s after close" }
          Write-Host "exit code $($p.ExitCode)"

          $lines = @()
          $fail = @()
          foreach ($m in "workingSetMB", "privateMB", "handles", "gdi", "user") {
            $v = $samples | ForEach-Object { [double]$_.$m }
            $first = ($v[0..2] | Measure-Object -Average).Average
            $last = ($v[13..15] | Measure-Object -Average).Average
            $growth = if ($first -gt 0) { ($last - $first) / $first } else { 0 }
            $monotonic = $true
            for ($k = 1; $k -lt $v.Count; $k++) { if ($v[$k] -le $v[$k - 1]) { $monotonic = $false } }
            $minAbs = @{ workingSetMB = 15; privateMB = 15; handles = 50; gdi = 20; user = 20 }[$m]
            $line = "{0}: first3 {1:0.0} last3 {2:0.0} growth {3:P1} strictly-rising {4}" -f $m, $first, $last, $growth, $monotonic
            $lines += $line
            # Clear growth only: >25 % AND a real absolute amount, or a handle/GDI/USER count that rose at every sample.
            if ($growth -gt 0.25 -and ($last - $first) -gt $minAbs) { $fail += $line }
            if ($m -in "handles", "gdi", "user" -and $monotonic -and ($v[-1] - $v[0]) -gt 20) { $fail += "$line (monotonic)" }
          }
          $lines | Set-Content (Join-Path $dir "soak-summary.txt")
          $lines | ForEach-Object { Write-Host $_; Add-Content $env:GITHUB_STEP_SUMMARY "- $_" }
          $errors = Select-String -Path $log -Pattern "Unhandled|UI exception|Update failed|Card .* update failed|Read failed|Unobserved" -ErrorAction SilentlyContinue
          if ($errors) { $errors | ForEach-Object { Write-Host $_.Line }; $fail += "errors in soak.log" }
          if ($p.ExitCode -ne 0) { $fail += "exit code $($p.ExitCode)" }
          if ($fail) { throw "soak test failed: $($fail -join '; ')" }

      - name: Smoke test (real LibreHardwareMonitor provider on the CI VM)
        shell: pwsh
        continue-on-error: true
        run: |
          $exe = (Resolve-Path "artifacts/publish/pc-monitor.exe").Path
          $shots = (Resolve-Path "artifacts/shots").Path
          $png = Join-Path $shots "real-ci-vm.png"
          $log = Join-Path $shots "real-ci-vm.log"
          $p = Start-Process -FilePath $exe -ArgumentList @("--screenshot", $png, "--ticks", "3", "--size", "1600x1000", "--log", $log, "--settings", (Join-Path $shots "settings-real.json")) -PassThru
          if (-not $p.WaitForExit(240000)) { $p.Kill(); throw "real provider timed out" }
          if (Test-Path $log) { Get-Content $log }
          if (-not (Test-Path $png)) { throw "real provider: no screenshot (exit $($p.ExitCode))" }

      - name: Second instance exits (real provider)
        shell: pwsh
        continue-on-error: true
        run: |
          $exe = (Resolve-Path "artifacts/publish/pc-monitor.exe").Path
          $shots = (Resolve-Path "artifacts/shots").Path
          $a = Start-Process -FilePath $exe -PassThru -ArgumentList @("--log", (Join-Path $shots "instance-1.log"), "--settings", (Join-Path $shots "settings-instance.json"))
          Start-Sleep -Seconds 15
          $logB = Join-Path $shots "instance-2.log"
          $b = Start-Process -FilePath $exe -PassThru -ArgumentList @("--log", $logB, "--settings", (Join-Path $shots "settings-instance.json"))
          $exited = $b.WaitForExit(60000)
          if (Test-Path $logB) { Get-Content $logB }
          $null = $a.CloseMainWindow()
          if (-not $a.WaitForExit(30000)) { $a.Kill() }
          if (-not $exited) { $b.Kill(); throw "second instance did not exit" }
          if (-not (Select-String -Path $logB -Pattern "Another instance is running" -Quiet)) { throw "second instance did not detect the first" }
          if ($a.ExitCode -ne 0) { throw "first instance exit code $($a.ExitCode)" }
          Write-Host "ok: second instance exited ($($b.ExitCode)), first closed cleanly"

      - name: Build installer (Inno Setup)
        id: installer
        shell: pwsh
        continue-on-error: true
        run: |
          $iscc = $null
          foreach ($attempt in 1..3) {
            $iscc = @(
              (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source,
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
              "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
            ) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
            if ($iscc) { break }
            Write-Host "ISCC.exe not found, installing Inno Setup with choco (attempt $attempt)"
            choco install innosetup -y --no-progress
          }
          if (-not $iscc) { throw "ISCC.exe not available after 3 attempts" }
          Write-Host "Using $iscc"
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if (-not $version) { throw "Version not found in Directory.Build.props" }
          & $iscc "/DAppVersion=$version" installer/pc-monitor.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }
          # Same script with an older version number, for the upgrade test (0.4 used this script unchanged apart from the version).
          & $iscc "/DAppVersion=0.4.0" "/DOutputDir=..\artifacts\installer-old" installer/pc-monitor.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC (old version) failed ($LASTEXITCODE)" }
          $setup = "artifacts/installer/pc-monitor-setup.exe"
          if (-not (Test-Path $setup)) { throw "pc-monitor-setup.exe missing" }
          Write-Host "pc-monitor-setup.exe: $((Get-Item $setup).Length) bytes, version $version"

      - name: Test installer (silent install / uninstall, app never launched)
        if: steps.installer.outcome == 'success'
        shell: pwsh
        run: |
          $setup = (Resolve-Path "artifacts/installer/pc-monitor-setup.exe").Path
          $desktopLnk = Join-Path ([Environment]::GetFolderPath("Desktop")) "PC Monitor.lnk"
          $startLnk = Join-Path ([Environment]::GetFolderPath("Programs")) "PC Monitor.lnk"

          function Install([string]$dir, [string]$tasks) {
            $a = @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=`"$dir`"", "/TASKS=`"$tasks`"", "/LOG=`"$dir-setup.log`"")
            $p = Start-Process -FilePath $setup -ArgumentList $a -Wait -PassThru
            if ($p.ExitCode -ne 0) { Get-Content "$dir-setup.log" -ErrorAction SilentlyContinue; throw "setup exit $($p.ExitCode)" }
          }
          function Uninstall([string]$dir) {
            $p = Start-Process -FilePath (Join-Path $dir "unins000.exe") -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "uninstall exit $($p.ExitCode)" }
            # The uninstaller hands over to a copy of itself in %TEMP%; wait until it has finished.
            $deadline = (Get-Date).AddSeconds(120)
            while ((Test-Path (Join-Path $dir "unins000.exe")) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 500 }
            Start-Sleep -Seconds 2
          }
          function Check([bool]$ok, [string]$what) {
            if (-not $ok) { throw "FAIL: $what" }
            Write-Host "ok: $what"
          }

          # Run 1: desktop shortcut task ticked.
          $dir = Join-Path $env:RUNNER_TEMP "pcm-install-1"
          Install $dir "desktopicon"
          Check (Test-Path (Join-Path $dir "pc-monitor.exe")) "exe installed in $dir"
          Check (Test-Path $desktopLnk) "desktop shortcut exists"
          Check (Test-Path $startLnk) "Start Menu shortcut exists"
          Set-Content (Join-Path $dir "settings.json") "{}"
          Set-Content (Join-Path $dir "pc-monitor.log") "x"
          Uninstall $dir
          Check (-not (Test-Path (Join-Path $dir "pc-monitor.exe"))) "exe removed"
          Check (-not (Test-Path (Join-Path $dir "unins000.exe"))) "uninstaller removed"
          Check (-not (Test-Path (Join-Path $dir "settings.json"))) "settings.json removed"
          Check (-not (Test-Path (Join-Path $dir "pc-monitor.log"))) "pc-monitor.log removed"
          Check (-not (Test-Path $desktopLnk)) "desktop shortcut removed"
          Check (-not (Test-Path $startLnk)) "Start Menu shortcut removed"

          # Run 2: no tasks, so no desktop shortcut.
          $dir = Join-Path $env:RUNNER_TEMP "pcm-install-2"
          Install $dir ""
          Check (Test-Path (Join-Path $dir "pc-monitor.exe")) "exe installed in $dir"
          Check (-not (Test-Path $desktopLnk)) "no desktop shortcut with /TASKS=`"`""
          Check (Test-Path $startLnk) "Start Menu shortcut exists"
          Uninstall $dir
          Check (-not (Test-Path (Join-Path $dir "pc-monitor.exe"))) "exe removed"
          Check (-not (Test-Path $startLnk)) "Start Menu shortcut removed"

          # Run 3: upgrade 0.4 -> current over the same folder: one Apps entry, one shortcut each, new version registered.
          $old = (Resolve-Path "artifacts/installer-old/pc-monitor-setup.exe").Path
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP "pcm-install-3"
          $p = Start-Process -FilePath $old -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=`"$dir`"", "/TASKS=`"desktopicon`"") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "old setup exit $($p.ExitCode)" }
          $uninstallKeys = { @(Get-ChildItem "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall" -ErrorAction SilentlyContinue |
              Where-Object { (Get-ItemProperty $_.PSPath).DisplayName -eq "PC Monitor" }) }
          Check ((& $uninstallKeys).Count -eq 1) "0.4 registered once"
          Check ((Get-ItemProperty (& $uninstallKeys)[0].PSPath).DisplayVersion -eq "0.4.0") "0.4 DisplayVersion"
          $localApp = Join-Path $env:LOCALAPPDATA "PcMonitor"
          New-Item -ItemType Directory -Force $localApp | Out-Null
          Set-Content (Join-Path $localApp "settings.json") '{"Layout": "Columns3"}'
          Install $dir "desktopicon"
          $keys = & $uninstallKeys
          Check ($keys.Count -eq 1) "one Apps entry after upgrade (found $($keys.Count))"
          Check ((Get-ItemProperty $keys[0].PSPath).DisplayVersion -eq $version) "DisplayVersion is $version after upgrade"
          Check (@(Get-ChildItem ([Environment]::GetFolderPath("Desktop")) -Filter "PC Monitor*.lnk").Count -eq 1) "one desktop shortcut"
          Check (@(Get-ChildItem ([Environment]::GetFolderPath("Programs")) -Recurse -Filter "PC Monitor*.lnk").Count -eq 1) "one Start Menu shortcut"
          Check ((Get-Item (Join-Path $dir "pc-monitor.exe")).VersionInfo.FileVersion.StartsWith($version)) "upgraded exe is $version"
          Check ((Get-Content (Join-Path $localApp "settings.json") -Raw) -match "Columns3") "user settings kept by the upgrade"
          Set-Content (Join-Path $localApp "settings.json.tmp") "{}"
          Set-Content (Join-Path $localApp "pc-monitor.log") "x"
          Uninstall $dir
          Check ((& $uninstallKeys).Count -eq 0) "Apps entry removed"
          Check (-not (Test-Path (Join-Path $dir "pc-monitor.exe"))) "exe removed"
          Check (-not (Test-Path $desktopLnk)) "desktop shortcut removed"
          Check (-not (Test-Path $localApp)) "settings, temp file and log in %LOCALAPPDATA%\PcMonitor removed"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pc-monitor-${{ github.sha }}
          path: |
            artifacts/publish/pc-monitor.exe
            artifacts/installer/pc-monitor-setup.exe
            artifacts/shots
            artifacts/soak
            artifacts/test-results

      - name: Push screenshots to ci-screenshots branch
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          cd artifacts/shots
          git init -q
          git checkout -q -b ci-screenshots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-screenshots

      - name: Publish release "latest"
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          version=$(sed -n 's:.*<Version>\([0-9]*\.[0-9]*\).*</Version>.*:\1:p' Directory.Build.props | head -1)
          cp artifacts/publish/pc-monitor.exe pc-monitor.exe
          assets=(pc-monitor.exe)
          if [ -f artifacts/installer/pc-monitor-setup.exe ]; then
            cp artifacts/installer/pc-monitor-setup.exe pc-monitor-setup.exe
            assets+=(pc-monitor-setup.exe)
          fi
          if gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          fi
          git push --delete origin refs/tags/latest 2>/dev/null || true
          gh release create latest "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "latest" \
            --notes "pc-monitor ${version} built from ${GITHUB_SHA}. Windows 11 x64. pc-monitor-setup.exe = installer (per-user, Start Menu + optional desktop shortcut); pc-monitor.exe = portable self-contained exe. Both unsigned; the app asks for administrator rights. See README.md and OWNER-TODO.md." \
            --latest
          gh release view latest --repo "$GITHUB_REPOSITORY" --json tagName,targetCommitish,assets
